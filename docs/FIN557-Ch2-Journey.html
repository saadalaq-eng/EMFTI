function detectView(){const w=Math.min(window.innerWidth,document.documentElement.clientWidth||window.innerWidth);const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;const sw=Math.min(screen.width||w,screen.height||w);return (w<=760||(coarse&&sw<=500))?'mobile':'desktop';}

}

 need:['ولا شي، هذي نقطة البداية.','Nothing. This is where it starts.'],

 how:[['اسأل عن الماضي بس: «احكِ لي عن آخر مرة حاولت تدخر». ولا تسأل أبداً «هل بتستخدم…».','تابع القصة: «وبعدين؟ وليش كذا؟». المحاور يتكلم ٢٠٪ من الوقت بس، وبعد الختام اسكت وانتظر.','خلال ساعة عبّي ورقة التسجيل: وش قال (حرفياً)، وش سوّى، ووش فاجأك.','المراقبة (موصى بها): اجلس جنب الشخص وهو يستخدم تطبيقه، وسجّل الأفعال بس مع الوقت. بعدها قارنها بكلامه.'],['Ask about the past only: “Walk me through the last time you tried to save.” Never ask “would you use…”.','Follow the story: “What next? Why that?” The interviewer talks 20% of the time; after the close, stay silent and wait.','Within an hour, fill the record sheet: what they said (verbatim), what they did, what surprised you.','Observation (recommended): sit beside them as they use their app and record actions only, with the time. Then compare with what they said.']],
 trap:['تسأل عن المستقبل: «هل بتستخدم تطبيق يسوي كذا؟». الجواب رأي، مو دليل.','Asking about the future: “Would you use an app that…?” The answer is an opinion, not evidence.'],
 check:[['سألت شخص: «هل بتستخدم تطبيق يقفل مدخراتك؟» وقال: «أكيد!». هل هذا دليل؟','لا. هذا رأي عن المستقبل، ومكانه الدرجة ٢ من ٦ في سلّم الأدلة. الدليل هو وش سوّى آخر مرة حاول يدخر.'],['You asked: “Would you use an app that locks your savings?” They said “Definitely!” Is that evidence?','No. It is an opinion about the future, rung 2 of 6 on the Evidence Ladder. Evidence is what they did the last time they tried to save.']]},

 give:['ثلاث أسطر: الوظيفة العملية والعاطفية والاجتماعية، والطبقة اللي تفشل فيها الحلول الحالية.','Three lines (functional, emotional, social job) and the layer on which today’s solutions fail.'],
 how:[['اكتب الموقف بصيغة «لما…»: لما ينزل راتبي، لما يغريني شي، لما يتأجل الهدف.','الوظيفة العملية: المهمة اللي لازم تنقضي، بكلام الشخص.','العاطفية من ربع «يحس»: كيف يبي يحس. والاجتماعية: كيف يبي يشوفه الناس اللي يهمونه.','حدد الطبقة اللي تفشل فيها الحلول الحالية. نادراً تكون العملية.'],['State the situation as “when I…”: when my salary lands, when something tempts me, when a goal date moves.','Functional job: the practical task that must get done, in the person’s terms.','Emotional job from FEELS: how they want to feel. Social job: how they want to be seen by people who matter.','Name the layer where current solutions fail. It is rarely the functional one.']],
 trap:['تكتب الوظيفة كمنتج («يبي تطبيق ادخار»)، أو توقف عند الطبقة العملية وتفوّت السبب الحقيقي لرفض الحلول.','Writing the job as a product (“wants a savings app”), or stopping at the functional layer and missing why solutions get rejected.'],
 check:[['تطبيق الميزانية عند سارة يسوي وظيفته العملية. ليش حذفته؟','لأنه فشل في الطبقة العاطفية: «يقول لي اللي صرفته، وأنا أعرفه». ما خلاها تحس بسيطرة.'],['Sara’s budgeting app did its functional job. Why did she delete it?','It failed on the emotional layer: “It just told me what I’d already spent.” It did not make her feel in control.']]},
{id:'lad',ph:'d',icon:'ladder',must:0,chk:1,name:['سلّم الأدلة','Evidence Ladder'],tool:'Evidence Ladder',
 q:['وش من قناعاتنا دليل، ووش منها أمل؟','Which of our beliefs are evidence, and which are hope?'],
 inS:['ادعاءات الفريق عن العميل','The team’s claims about the customer'],outS:['كل ادعاء على درجة من ٦','Each claim on a rung of 6'],
 need:['الادعاءات اللي طلعت من المقابلات والمراقبة وخريطة التعاطف والـ JTBD.','The claims from interviews, observation, the Empathy Map and JTBD.'],
 give:['كل ادعاء على درجة من «افتراض» إلى «التزام»، ووش يرفعه درجة. يدخل في ملف Stage Gate 1 كدليل.','Each claim placed from “assumption” to “committed”, with what would lift it a rung. It goes into the Stage Gate 1 dossier as proof.'],
 how:[['اكتب كل ادعاء عن العميل في سطر، بكلام بسيط.','سجّل مصدره: نقاش فريق، اقتباس، فعل موصوف، مراقبة، تكرار، أو دفع فلوس ووقت.','حط الدرجة بأمانة: ١ افتراض، ٢ رأي، ٣ سلوك سابق، ٤ مُشاهد، ٥ متكرر، ٦ التزام. الاقتباس القوي يبقى ٢.','أهم ثلاث ادعاءات لازم تكون ٣ أو أعلى. اللي تحت ارجع فيها للمقابلات.'],['List every claim about the customer, one per row, in plain words.','Record its source: team talk, a quote, a described action, an observation, a repeat, money or time spent.','Assign the rung honestly: 1 assumption, 2 opinion, 3 past behaviour, 4 observed, 5 repeated, 6 committed. A forceful quote is still 2.','Your three key claims must sit on rung 3 or above. Below that, go back to interviews.']],
 trap:['تعطي الاقتباس الحماسي درجة عالية. «أكيد بستخدمه» تبقى رأي مهما كانت قوية.','Giving an enthusiastic quote a high rung. “I’d definitely use it” stays an opinion however strong it sounds.'],
 check:[['ريم تدفع ١,٠٠٠ ريال كل شهر للجمعية من ٣ سنين. أي درجة؟','٦، التزام: صرفت فلوس فعلاً وبشكل متكرر.'],['Reem has paid 1,000 riyals a month to the circle for 3 years. Which rung?','6, committed: she has actually spent money, repeatedly.']]},
{id:'det',ph:'d',icon:'detect',must:0,chk:1,name:['اختبار المشكلة','Problem-Detection Test'],tool:'Problem-Detection Test',
 q:['هل لقينا مشكلة حقيقية لشخص حقيقي؟','Have we detected a real problem for a real person?'],
 inS:['التعاطف + JTBD + السلّم','Empathy + JTBD + Ladder'],outS:['حكم + مشكلة بلا حل','A verdict + a solution-free problem'],
 need:['خريطة التعاطف (مين)، والـ JTBD (وش)، وسلّم الأدلة (الدليل).','The Empathy Map (who), JTBD (what) and the Evidence Ladder (evidence).'],
 give:['حكم على الفكرة (حقيقية، مُساء تأطيرها، أو مفترضة) وعبارة مشكلة منظفة من الحل تبدأ منها جملة الـ POV.','A verdict on the idea (real, misframed, or assumed) and a solution-free problem statement that the POV starts from.'],
 how:[['مين: شخص محدد في موقف محدد، مو «الكل» ولا فئة عمرية.','وش: المشكلة اللي كانت موجودة قبل أي فكرة، بدون اسم منتج.','الدليل: سلوك متكرر، حيل، وقت أو فلوس ضايعة، تخلّي عن أدوات، استعداد يتصرف.','الحكم، ثم افرز العبارة: عرض، افتراض، مشكلة، حل. وافحص الفخاخ الأربعة.'],['WHO: a specific person in a situation, not “everyone” or a demographic.','WHAT: the lived problem that existed before any idea, with no product name.','EVIDENCE: repeated behaviour, workarounds, wasted time or money, abandoned tools, willingness to act.','Give the verdict, then sort the statement: symptom, assumption, problem, solution. Check the four traps.']],
 trap:['الوقوع في أحد الفخاخ الأربعة: البداية بالحل، «نعرف عميلنا»، مقاييس داخلية («نبي استخدام أعلى»)، أو بحث مجامل («قالوا عاجبهم»).','Falling into one of the four traps: solution-first, “we know this customer”, internal metrics (“we need higher usage”), or polite research (“they said they like it”).'],
 check:[['«الشباب ما عندهم ثقافة مالية». في أي خانة من الفرز؟','افتراض. والأدلة تعارضه: ريم «مو شخص أرقام» ومع ذلك ملتزمة ٣ سنين.'],['“Young people lack financial literacy.” Which box in the sort?','Assumption. The evidence contradicts it: Reem “isn’t a numbers person” yet has been committed for 3 years.']]},
{id:'aff',ph:'s',icon:'notes',must:1,name:['التجميع','Affinity'],tool:'Affinity Map',
 q:['وش المواضيع اللي تطلع من الأدلة نفسها؟','Which themes come out of the evidence itself?'],
 inS:['كل الملاحظات مفككة','Every note, atomised'],outS:['مجموعات بأسماء سلوك','Clusters named by behaviour'],
 need:['كل الملاحظات من المقابلات والمراقبة وخرائط التعاطف، وكل ملاحظة في ورقة لحالها.','All notes from interviews, observation and empathy maps, one idea per note.'],
 give:['مجموعات بأسماء تصف السلوك، والملاحظات الشاذة محطوطة على جنب.','Notes grouped into themes named after behaviour, with outliers kept to one side.'],
 how:[['فكّك: اقتباس واحد أو فعل واحد أو حيلة وحدة في كل ورقة. بدون ملخصات.','جمّع الأوراق حسب السلوك، مو حسب الشخص.','سمّ كل مجموعة بكلام بسيط يصف وش يصير.','حط الشاذ والتناقضات على جنب ولا ترميها، وبعدين اكتب جملة معنى لكل مجموعة.'],['Atomise: one quote, action or workaround per note. No summaries.','Group notes by behaviour, never by person.','Name each cluster in plain words that describe what happens.','Keep outliers and contradictions aside, never discard them; then write one sentence of meaning per cluster.']],
 trap:['تفسّر قبل ما تجمّع، أو تجمّع حسب الشخص («ملاحظات سارة»). كذا تطلع لك المواضيع اللي كنت تتوقعها من الأساس.','Interpreting before clustering, or clustering by person (“Sara’s notes”). You end up with the themes you expected all along.'],
 check:[['جمّعت كل ملاحظات سارة في مجموعة وحدة. وش الغلط؟','التجميع يكون حسب السلوك مو الشخص. ملاحظات سارة تتوزع على «الفلوس القريبة تنصرف» و«الحاجز ينجح».'],['You grouped all of Sara’s notes into one cluster. What is wrong?','Cluster by behaviour, not person. Sara’s notes belong in “money within reach gets spent” and “a barrier works”.']]},
{id:'pat',ph:'s',icon:'bars',must:1,name:['النمط','Pattern'],tool:'Pattern Finder',
 q:['وش الشي اللي يتكرر عند أكثر من شخص؟','What keeps happening across several people?'],
 inS:['المجموعات','The clusters'],outS:['«X يصير لما Y»','“X happens when Y”'],
 need:['المجموعات من الـ Affinity Map.','The clusters from the Affinity Map.'],
 give:['نمط في سطر واحد بصيغة «X يصير لما Y»، وحالة شاذة تستاهل التفكير.','One pattern in one line, “X happens when Y”, and an outlier worth examining.'],
 how:[['اكتب كل نمط محتمل.','عدّ في كم شخص أو موقف يظهر، وتأكد من الملاحظات الميدانية.','أقل من ٣ = حكاية فردية. ٣ أو أكثر = نمط. شخص يخالفه = حالة شاذة.','افحص الشاذ قبل ما تتجاهله، غالباً هو اللي لقى الشي اللي يشتغل.'],['List every candidate pattern.','Count the people or moments it appears in; confirm against field observations.','Under 3 = anecdote. 3 or more = pattern. One person who contradicts it = outlier.','Examine the outlier before dismissing it. They often found what works.']],
 trap:['تبني الاتجاه على أعلى قصة صوتاً. القصة القوية ممكن تكون شخص واحد بس.','Building the direction on the loudest story. A vivid story can still be one person.'],
 check:[['سلوك ظهر عند شخصين بس. نمط ولا حكاية؟','حكاية فردية. النمط يحتاج ٣ أشخاص أو مواقف على الأقل.'],['A behaviour shows up in two people only. Pattern or anecdote?','Anecdote. A pattern needs at least three people or moments.']]},
{id:'why',ph:'s',icon:'roots',must:1,name:['السبب الجذري','Root cause'],tool:'Five Whys',
 q:['ليش يصير هذا النمط أصلاً؟','Why does this pattern happen at all?'],
 inS:['النمط + الأدلة','Pattern + evidence'],outS:['سبب جذري إنساني','A human root cause'],
 need:['النمط، وسلّم الأدلة عشان تتأكد إن كل «ليش» مسنودة بدليل.','The pattern, and the Evidence Ladder to confirm each “why” is backed by a note.'],
 give:['سبب جذري: إنساني ومحدد ويقدر التصميم يتعامل معه، ومعه سلسلة الأسباب كاملة.','A root cause that is human, specific and actionable, with the full chain behind it.'],
 how:[['اكتب النمط في أول سطر.','اسأل «ليش؟» واكتب الجواب مع الملاحظة اللي تسنده. أي جواب بدون دليل تخمين ويرفض.','كل مستوى لازم يكون أكثر تحديداً وإنسانية من اللي قبله.','وقف لما يكون السبب إنساني ومحدد وقابل للتصميم، واقرأ السلسلة بالعكس وتأكد من كل حلقة.'],['Write the pattern in the first row.','Ask “why?” and write the answer with the note that supports it. An answer with no evidence is a guess and is rejected.','Each level should be more specific and more human than the last.','Stop when the cause is human, specific and actionable; read the chain backwards and check every link.']],
 trap:['تقف عند عرض، أو تلوم الشخص («ما يفهمون»)، أو تخلي السبب ميزة ناقصة («ما فيه تنبيه»)، أو آلية ما بينها البحث.','Stopping at a symptom, blaming the person (“they don’t understand”), making the cause a missing feature (“there is no reminder”), or a mechanism the research never showed.'],
 check:[['وصلت لسبب: «ما فيه ميزة تذكير بالادخار». توقف؟','لا. هذا ميزة ناقصة مو سبب إنساني. اسأل: ليش التذكير بيفرق؟ لين توصل لسلوك أو شعور.'],['You reached: “There is no savings-reminder feature.” Stop?','No. That is a missing feature, not a human cause. Ask why a reminder would matter until you reach a behaviour or a feeling.']]},
{id:'ins',ph:'s',icon:'bulb',must:1,name:['الاستبصار','Insight'],tool:'Insight Statement',
 q:['وش السبب الإنساني الخفي اللي يفسّر النمط؟','What hidden human reason explains the pattern?'],
 inS:['النمط + السبب + الشاذ','Pattern + root + outlier'],outS:['استبصار يغيّر قناعة','An insight that changes a belief'],
 need:['المجموعات والنمط والسبب الجذري والحالة الشاذة.','The clusters, the pattern, the root cause and the outlier.'],
 give:['جملة أو جملتين تغيّر شي كان الفريق يصدقه قبل البحث، وتصير «لأن» في جملة الـ POV.','One or two sentences that change something the team believed before the research, and become the “because” of the POV.'],
 how:[['اكتب الملاحظة الفردية: شخص واحد وسلوك واحد.','اكتب النمط: نفس السلوك عند أكثر من شخص.','اكتب الاستبصار: ليش يصير النمط، ولازم يفسّر الحالة الشاذة بعد.','افحصه بخمسة اختبارات: إنساني، مبني على دليل، غير بديهي، يفسّر، ويفتح أكثر من اتجاه.'],['Write the finding: one person, one behaviour.','Write the pattern: the same behaviour across several people.','Write the insight: why the pattern exists. It must explain the outlier too.','Test it five ways: human, evidence-based, non-obvious, explanatory, generative.']],
 trap:['استبصار تقدر تكتبه قبل البحث («الناس يبون يدخرون أكثر») هو نمط متنكر. ارجع للأدلة.','An insight you could have written before the research (“young people want to save more”) is a pattern in disguise. Go back to the evidence.'],
 check:[['«الشباب يبون يدخرون أكثر». هل هذا استبصار؟','لا. تقدر تكتبه قبل البحث، يعني يفشل في اختبار «غير بديهي».'],['“Young people want to save more.” Is that an insight?','No. You could write it before any research, so it fails the non-obvious test.']]},
{id:'pov',ph:'f',icon:'target',must:1,name:['بيان المشكلة','Point of view'],tool:'Point-of-View',
 q:['مين بالضبط، وش يحتاج، وليش؟','Who exactly, needs what, and why?'],
 inS:['مستخدم + تقدم + استبصار','User + progress + insight'],outS:['جملة مشكلة بلا حل','A solution-free problem sentence'],
 need:['المستخدم من خريطة التعاطف، والتقدم من الـ JTBD، والـ «لأن» من الاستبصار، والعبارة المنظفة من اختبار المشكلة.','The user from the Empathy Map, the progress from JTBD, the “because” from the insight, and the clean statement from the Problem-Detection Test.'],
 give:['جملة وحدة بدون أي حل: [مستخدم محدد] يحتاج [تقدم] لأن [استبصار].','One sentence with no solution in it: [specific user] needs [progress] because [insight].'],
 how:[['عبّي الأجزاء الثلاثة من الأدوات اللي قبل.','اكتب ٢ أو ٣ نسخ واقرأها بصوت عالي.','اختر النسخة اللي يفهمها كل الفريق بنفس الطريقة، واكتب ليش اخترتها.','احذف كلمات الحلول: «أبسط، أسرع، تلقائي، تطبيق، منصة». ولازم تقدر تتخيل ٣ حلول مختلفة لها.'],['Fill the three parts from the earlier tools.','Write two or three versions and read them aloud.','Pick the one everyone reads the same way, and record why.','Remove solution words: “simpler, faster, automatic, app, platform”. It must allow at least three different solutions.']],
 trap:['تدس الحل في الجملة («يحتاج تطبيق يقفل المدخرات»). لو ما تقدر تتخيل ٣ حلول مختلفة لها، فهي مو مشكلة.','Hiding the solution in the sentence (“needs an app that locks savings”). If you cannot imagine three different answers, it is not a problem yet.'],
 check:[['«الموظف يحتاج تطبيق أسرع للادخار». وش المشكلة فيها؟','فيها حل («تطبيق») وكلمة حل («أسرع»)، وما فيها «لأن» مبنية على استبصار.'],['“The employee needs a faster savings app.” What is wrong?','It contains a solution (“app”) and a solution word (“faster”), and has no evidence-based “because”.']]},
{id:'hmw',ph:'f',icon:'compass',must:1,name:['سؤال HMW','How Might We'],tool:'How Might We + Altitude Check',
 q:['كيف نفتح باب الحلول بدون ما نختار حل؟','How do we open the door to solutions without choosing one?'],
 inS:['بيان المشكلة','The POV statement'],outS:['سؤال مفتوح بخمس إجابات','An open question with five answers'],
 need:['بيان المشكلة (POV).','The Point-of-View statement.'],
 give:['سؤال مفتوح واحد، على الارتفاع الصحيح (Altitude Check)، يفتح أكثر من إجابة.','One open question, checked for altitude, that invites several answers.'],
 how:[['اكتبه بصيغة: كيف ممكن نساعد [المستخدم] [يحقق التقدم] بحيث / بدون [شرط الاستبصار]؟ لو احتجت «و» فهذا سؤالين.','اكتب ٥ إجابات مختلفة في دقيقتين. لو ما طلع لك إلا جواب واحد، الحل مدسوس في السؤال.','فحص الارتفاع (موصى به): اكتب نسخة واسعة جداً ونسخة ضيقة جداً، وحط سؤالك بينهم.','لو قريب من الضيق اصعد: «ليش هذا مهم؟». لو قريب من الواسع انزل: «وش بالضبط؟ لمين؟». احتفظ بالنسخ الثلاث كدليل.'],['Write it as: How might we help [user] [make progress] so that / without [insight condition]? If you need “and”, it is two questions.','List five different answers in two minutes. If only one comes, the solution is hidden in the question.','Altitude check (recommended): write a too-broad and a too-narrow version and place yours between them.','Close to narrow? Ladder up: “why does that matter?” Close to broad? Ladder down: “what specifically, for whom?” Keep all three as proof.']],
 trap:['سؤال فيه الحل («كيف نسوي تطبيق…») أو بدون مستخدم وموقف. الاثنين يضيّعون كل اللي بنيته في المحطات اللي قبل.','A question with the solution in it (“How might we build an app…”) or with no user and situation. Both waste everything built in the earlier stations.'],
 check:[['كيف تعرف إن سؤال HMW ضيق جداً؟','لما ما يطلع لك إلا جواب واحد له، لأن الحل مدسوس فيه.'],['How do you know an HMW is too narrow?','When it only has one possible answer. The solution is built into it.']]},
{id:'ref',ph:'f',icon:'frames',must:0,chk:1,name:['إعادة التأطير','Reframing'],tool:'Reframing',
 q:['هل اخترنا الإطار الصح للمشكلة؟','Did we choose the right frame for the problem?'],
 inS:['الاستبصار + POV + الأدلة','Insight + POV + evidence'],outS:['إطار مختار مع أسبابه','A chosen frame with its reasons'],
 need:['الاستبصار وجملة الـ POV والأدلة اللي وراهم.','The insight, the POV and the evidence behind them.'],
 give:['إطاران جنب بعض، وش يبني الفريق من كل واحد، والإطار المختار مع أسبابه. التبرير جزء من Submission 1.','Two frames side by side, what a team would build from each, and the chosen frame with its reasons. The reasoning is part of Submission 1.'],
 how:[['اكتب الإطار (أ): المشكلة مثل ما افترضها الفريق قبل البحث.','اكتب وش بيبني الفريق منه بشكل ملموس: ميزات، شاشات، رسائل.','اكتب الإطار (ب) من الاستبصار والأدلة، ووش بيبني منه.','لكل إطار: الأدلة اللي تدعمه واللي تعارضه. ثم اختر واكتب السبب.'],['Write Frame A: the problem as the team stated it before the research.','List concretely what a team would build from Frame A: features, screens, messages.','Write Frame B from the insight and the evidence, and what a team would build from it.','For each frame, the evidence that supports and contradicts it. Then choose, and record why.']],
 trap:['تختار الإطار المريح لأنه يناسب حل كنت ناوي عليه. الإطار يقرر وش يعتبر حل جيد.','Choosing the comfortable frame because it fits a solution you already had in mind. The frame decides what counts as a good solution.'],
 check:[['ليش التبرير جزء من التسليم مو بس الاختيار؟','لأن الإطار فوق كل قرار تصميم، وهنا تنحفظ قيمة البحث أو تضيع.'],['Why is the reasoning part of the submission, not only the choice?','Because the frame sits upstream of every design decision. This is where the value of the research is kept or lost.']]}
];
const IDX={};S.forEach((s,i)=>IDX[s.id]=i);
const mainNo=[];{let n=0;S.forEach((s,i)=>{mainNo[i]=s.chk?null:++n;});}
const badge=i=>S[i].chk?'◆':num(mainNo[i]);

/* ================= CASE SCENES ================= */
const av=k=>`<span class="av-c" style="background:${PPL[k][2]}">${T([PPL[k][0],PPL[k][1]]).charAt(0)}</span>`;
const pn=k=>T([PPL[k][0],PPL[k][1]]);
const outb=(txt,od)=>`<div class="outb" style="--od:${od}s"><span class="ol">${ico('out')}${U('outL')}</span>${T(txt)}</div>`;
const spot='<span class="spot"></span>';
let empPerson='reem';
function empQuad(k){const P=PACK.people[k];
 const says=T(P.q).slice(0,3),does=T(P.d).slice(0,4);

function filmTick(){clearTimeout(film);film=setTimeout(()=>{if(cur<S.length-1){go(cur+1);filmTick();}else stopFilm();},FILM_MS[S[cur].id]+(fx?700:0));}
function startFilm(){if(mode!=='case')setMode('case',true);film=-1;updateFilmBtn();
  if(cur!==0){go(0);}else{if(fx&&!reduce())chapterCard(0,()=>render('mode'));else render('mode');}
  filmTick();}
function stopFilm(){if(film===null)return;clearTimeout(film);film=null;updateFilmBtn();const b=document.getElementById('filmI');if(b){b.style.transition='none';b.style.width='0';}}
function updateFilmBtn(){const b=document.getElementById('btnFilm');b.innerHTML=film!==null?`${ico('pause')}${U('filmStop')}`:`${ico('film')}${U('film')}`;}

/* ================= EVIDENCE FILE ================= */
function mkList(items,prefix){return `<ul class="mk">${items.map((x,j)=>{const key=`mk_${prefix}_${j}`,m=F[key]||'';return `<li tabindex="0" role="button" data-mk="${key}" class="${m==='1'?'m1':m==='2'?'m2':''}">${x}</li>`;}).join('')}</ul>`;}
function vaultBody(){
  if(vtab==='before'){const B=PACK.before;return `<div class="pcard"><div class="vlegend">${U('vLegend')}</div><p style="margin:0">${T(B.intro)}</p>
   <div class="boxes"><div class="bx1"><b>${T(['قبل الكلاس، سوّ هذا','Before class, please do this'])}</b><ol style="margin:0;padding-inline-start:18px">${T(B.todo).map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="bx2"><b>${T(['ملاحظة عن قراءة البحث','A note on reading research'])}</b>${T(B.note)}</div><div class="bx3"><b>${T(['كيف انجمعت الأدلة','How this evidence was gathered'])}</b>${T(B.how)}</div><div class="bx4"><b>${T(['تذكّر','Remember'])}</b>${T(B.remember)}</div></div>
   <div class="bring"><div class="fld"><label for="vault_rep">${U('bring1')}</label><textarea id="vault_rep" data-vk="vault_rep" rows="2"></textarea></div><div class="fld"><label for="vault_sur">${U('bring2')}</label><textarea id="vault_sur" data-vk="vault_sur" rows="2"></textarea></div></div></div>`;}
  if(vtab==='field')return `<div class="pcard"><div class="vlegend">${U('vLegend')}</div><h3 style="color:var(--ink);font-size:16px">${ico('eye')}${T(['ملاحظات من المراقبة، مو من الأسئلة','Notes from watching, not asking'])}</h3>${mkList(PACK.field.map(f=>T(f)),'field')}</div>`;
  const k=vtab,P=PACK.people[k];
  return `<div class="pcard"><div class="pc-top">${av(k)}<div><h3>${pn(k)}</h3><div style="color:var(--ink-2);font-size:14px">${T(P.age)}</div></div></div>
   <div class="facts"><div><small>${U('fInc')}</small>${T(P.inc)}</div><div><small>${U('fWhere')}</small>${T(P.where)}</div><div><small>${U('fNow')}</small>${T(P.now)}</div></div>
   <div class="scenebox">${T(P.scene)}</div>
   <div class="vlegend">${U('vLegend')}</div>
   <div class="two"><div><h3>${ico('chat')}${U('inWords')}</h3>${mkList(T(P.q),k+'_q')}</div><div><h3>${ico('eye')}${U('sawDo')}</h3>${mkList(T(P.d),k+'_d')}</div></div>
   <div class="boxes"><div class="bx2"><b>${U('moment')}</b>${T(P.m)}</div><div class="bx1"><b>${U('tried')}</b>${T(P.t)}</div><div class="bx3"><b>${U('work')}</b>${T(P.w)}</div><div class="bx4"><b>${U('tension')}</b>${T(P.x)}</div></div>
   <p class="inote"><b>${U('inote')}:</b> ${T(P.n)}</p></div>`;
}
function renderVault(){
  document.getElementById('vT').textContent=U('vT');document.getElementById('vS').textContent=U('vS');document.getElementById('vClose').textContent=U('close');
  const tabs=[['before',`${ico('book')}${U('vBefore')}`],...PORDER.map(k=>[k,`${av(k)}${pn(k)}`]),['field',`${ico('eye')}${U('vField')}`]];
  document.getElementById('vtabs').innerHTML=tabs.map(t=>`<button type="button" data-vt="${t[0]}" aria-pressed="${t[0]===vtab}">${t[1]}</button>`).join('');
  document.querySelectorAll('#vtabs button').forEach(b=>b.onclick=()=>{vtab=b.dataset.vt;renderVault();});
  const body=document.getElementById('vbody');body.innerHTML=vaultBody();body.scrollTop=0;
  body.querySelectorAll('[data-mk]').forEach(li=>{const cyc=()=>{const k=li.dataset.mk,n=((+(F[k]||0))+1)%3;F[k]=n?String(n):'';li.className=n===1?'m1':n===2?'m2':'';queueSave();};
    li.addEventListener('click',cyc);li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cyc();}});});
  body.querySelectorAll('[data-vk]').forEach(t=>{t.value=F[t.dataset.vk]||'';t.addEventListener('input',()=>{F[t.dataset.vk]=t.value;queueSave();});});
}
function openVault(tab){stopFilm();if(tab)vtab=tab;renderVault();const vEl=document.getElementById('vault');vEl.hidden=false;document.getElementById('vClose').focus();}
function closeVault(){document.getElementById('vault').hidden=true;}

/* ================= CHROME ================= */
const HINTK={explain:'hint_explain',case:'hint_case',work:'hint_work'};
function setMode(m,silent){
  if(!silent)stopFilm();
  mode=m;try{localStorage.setItem(LS+'-mode',m);}catch(e){}
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m?'true':'false'));
  document.getElementById('wrap').classList.toggle('work',m==='work');
  document.getElementById('btnExport').hidden=m!=='work';document.getElementById('btnClear').hidden=m!=='work';
  document.getElementById('modehint').textContent=U(HINTK[m]);
  placePill();if(!silent)render('mode');
}
function placePill(){const b=document.querySelector(`.modes button[data-mode="${mode}"]`),p=document.getElementById('pill'),box=b.parentElement.getBoundingClientRect(),r=b.getBoundingClientRect();
  p.style.width=r.width+'px';p.style.height=r.height+'px';p.style.top=(r.top-box.top)+'px';p.style.left=(r.left-box.left)+'px';}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600);}

  document.getElementById('eyebrow').textContent=U('eyebrow');
  document.getElementById('h1').innerHTML=U('h1');
  document.getElementById('lede').textContent=U('lede');
  const mi={explain:'book',case:'flask',work:'pen'};
  document.querySelectorAll('.modes button').forEach(b=>b.innerHTML=`${ico(mi[b.dataset.mode])}${U('m_'+b.dataset.mode)}`);
  document.getElementById('modes').setAttribute('aria-label',U('modesL'));
  updateFilmBtn();
  document.getElementById('btnVault').innerHTML=`${ico('folder')}${U('vault')}`;
  document.getElementById('btnFx').innerHTML=`${ico('spark')}${U('fx')}`;document.getElementById('btnFx').setAttribute('aria-pressed',fx?'true':'false');
  document.getElementById('btnLang').innerHTML=`${ico('globe')}${U('lang')}`;
  document.getElementById('btnPresent').innerHTML=`${ico('screen')}${U('present')}`;
  document.getElementById('btnExport').innerHTML=`${ico('down')}${U('export')}`;

  document.getElementById('mapWrap').setAttribute('aria-label',U('mapL'));
  document.getElementById('list').setAttribute('aria-label',U('mapL'));

  const r2=U('road2');document.getElementById('road2').innerHTML=r2.map(x=>`<span class="${x.startsWith('Stage')||x.startsWith('Submission')?'gate':''}">${x}</span>`).join('<i>←</i>');
  document.getElementById('introK').textContent=U('introK');document.getElementById('introT').innerHTML=U('introT');document.getElementById('introS').textContent=U('introS');
  document.getElementById('introGo').textContent=U('introGo');document.getElementById('introSkip').textContent=U('introSkip');
  document.getElementById('introIcons').innerHTML=S.map((s,i)=>`<span style="--k:${i}">${ico(s.icon)}</span>`).join('');
  document.getElementById('chLang').textContent=U('chLang');document.getElementById('chDev').textContent=U('chDev');
  const ic2={mobile:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',desktop:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M1.5 20h21"/></svg>'};
  document.querySelectorAll('#devseg button').forEach(b=>{b.innerHTML=ic2[b.dataset.view]+' '+U('v_'+b.dataset.view);b.setAttribute('aria-pressed',b.dataset.view===effView()?'true':'false');b.onclick=()=>setView(b.dataset.view);});
  document.getElementById('detect').innerHTML=U('detected')+'<b>'+U('v_'+autoView)+'</b>';
  document.getElementById('btnView').innerHTML=(effView()==='mobile'?ic2.desktop+U('viewBtn')+U('v_desktop'):ic2.mobile+U('viewBtn')+U('v_mobile'));document.getElementById('chMode').textContent=U('chMode');
  document.querySelectorAll('#langseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false'));
  const mi2={explain:'book',case:'flask',work:'pen'};
  document.getElementById('mcards').innerHTML=['explain','case','work'].map(m=>`<button type="button" class="mcard" data-m="${m}" aria-pressed="${m===mode}"><span class="mi">${ico(mi2[m])}</span><b>${U('m_'+m)}</b><small>${U('md_'+m)}</small></button>`).join('');
  document.querySelectorAll('#mcards .mcard').forEach(c=>c.onclick=()=>{setMode(c.dataset.m);document.querySelectorAll('#mcards .mcard').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===mode?'true':'false'));});
  document.querySelector('#mt b').textContent=U('clearT');document.getElementById('md').textContent=U('clearD');document.getElementById('mYes').textContent=U('yes');document.getElementById('mNo').textContent=U('no');
  buildMap();buildList();placePill();render(null);
  if(!document.getElementById('vault').hidden)renderVault();
}


function setView(v){viewPref=v;try{localStorage.setItem('fin557-view',v);}catch(e){}applyView();
  document.querySelectorAll('#devseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===effView()?'true':'false'));
  const ic2={mobile:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',desktop:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M1.5 20h21"/></svg>'};
  document.getElementById('btnView').innerHTML=(effView()==='mobile'?ic2.desktop+U('viewBtn')+U('v_desktop'):ic2.mobile+U('viewBtn')+U('v_mobile'));
  requestAnimationFrame(()=>{placePill();render(null);});}
/* ================= EXPORT ================= */
function buildExport(){
  let md=`# ${lang==='ar'?'رحلة الفصل الثاني: ورشتي':'Chapter Two journey: my workshop'}\nFIN 557 · Understanding the Customer\n\n`;
  const r1=v('vault_rep'),r2=v('vault_sur');if(r1||r2)md+=`## ${U('vBefore')}\n\n${r1?`**${U('bring1')}:** ${r1}\n\n`:''}${r2?`**${U('bring2')}:** ${r2}\n\n`:''}`;
  S.forEach((s,i)=>{const w=W[s.id];md+=`## ${s.chk?'◆':num(mainNo[i])+'.'} ${T(s.name)} (${s.tool})${s.chk?' · '+U('rec'):''}\n\n`;
    w.f.forEach(g=>{
      if(g.t==='text'){const x=v(`${s.id}_${g.k}`);if(x)md+=`**${T(g.l)}:** ${x}\n\n`;}
      else if(g.t==='rows'){for(let r=0;r<g.n;r++){const cells=g.cols.map(c=>{let val=v(`${s.id}_${g.k}${r}_${c[0]}`);if(val&&c[3]){const oi=c[3][0].indexOf(val);if(oi>=0)val=T([c[3][0][oi],c[3][1][oi]]);}return [T(c[1]),val];}).filter(c=>c[1]);if(cells.length)md+=`- **${T(g.label)}${g.n>1?' '+num(r+1):''}**: ${cells.map(c=>`${c[0]}: ${c[1]}`).join(' | ')}\n`;}md+='\n';}
      else if(g.t==='whys'){for(let r=0;r<=g.n;r++){const t=v(`${s.id}_w${r}_t`),e=v(`${s.id}_w${r}_e`);if(t||e)md+=`- **${r===0?T(['النمط','Pattern']):T(['ليش ','Why '])+num(r)}**: ${t}${e?` (${U('evidence')}${e})`:''}\n`;}md+='\n';}
      else if(g.t==='checks'){const on=g.items.filter(it=>F[`${s.id}_${g.k}_${it[0]}`]==='1').map(it=>T(it[1]));if(on.length)md+=`✓ ${on.join(' · ')}\n\n`;}
      else if(g.t==='pov'){const t=povText();if(t)md+=`> ${t}\n\n`;}
      else if(g.t==='hmw'){const t=hmwText();if(t)md+=`> ${t}\n\n`;}
    });});
  return md;
}
async function doExport(){
  const md=buildExport();
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:'FIN557-Ch2-Journey.md',data:md});toast(U('exported'));return;}catch(e){if(e&&e.code==='declined')return;}}}catch(e){}
  try{await navigator.clipboard.writeText(md);toast(U('copied'));}catch(e){toast(U('noCopy'));}
}

/* ================= BOOT ================= */
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('btnFilm').onclick=()=>{film!==null?stopFilm():startFilm();};
document.getElementById('btnVault').onclick=()=>openVault();
document.getElementById('vClose').onclick=closeVault;

  const fwd=lang==='ar'?'ArrowLeft':'ArrowRight',back=lang==='ar'?'ArrowRight':'ArrowLeft';
  if(e.key===fwd){stopFilm();go(cur+1);}if(e.key===back){stopFilm();go(cur-1);}
  if(e.key===' '&&!document.getElementById('intro').classList.contains('out')){e.preventDefault();closeIntro();}});
window.addEventListener('resize',()=>{placePill();const nv=detectView();if(nv!==autoView){autoView=nv;if(viewPref==='auto'){applyView();render(null);}const dt=document.getElementById('detect');if(dt)dt.innerHTML=U('detected')+'<b>'+U('v_'+autoView)+'</b>';}});
document.getElementById('btnView').onclick=()=>setView(effView()==='mobile'?'desktop':'mobile');

const h0=(location.hash||'').slice(1);if(IDX[h0]!=null)cur=IDX[h0];
document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));
document.getElementById('wrap').classList.toggle('work',mode==='work');
document.getElementById('btnExport').hidden=mode!=='work';document.getElementById('btnClear').hidden=mode!=='work';
try{applyLang();}catch(err){console.error(err);try{document.getElementById('intro').hidden=true;document.getElementById('sheet').innerHTML='<p style="padding:20px">تعذّر تشغيل الصفحة في هذا العارض. افتح الملف في Safari أو Chrome.<br>This viewer could not run the page. Open it in Safari or Chrome.</p>';}catch(e){}}
requestAnimationFrame(placePill);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placePill);
function closeIntro(){
  const it=document.getElementById('intro');if(it.classList.contains('out'))return;
  it.classList.add('out');setTimeout(()=>{it.hidden=true;},900);
  const mw=document.getElementById('mapWrap');mw.classList.remove('pre');void mw.offsetWidth;mw.classList.add('draw');

document.getElementById('introGo').onclick=closeIntro;
document.querySelectorAll('#langseg button').forEach(b=>b.onclick=()=>{if(b.dataset.lang===lang)return;lang=b.dataset.lang;try{localStorage.setItem('fin557-lang',lang);}catch(e){}applyLang();});

if(reduce()||IDX[h0]!=null){closeIntro();}else{setTimeout(()=>{try{document.getElementById('introGo').focus({preventScroll:true});}catch(e){}},2400);}
initStore();
