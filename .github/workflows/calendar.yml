name: Update calendar feed

# Rebuilds calendar.ics on the gh-pages branch from Firestore so that
# subscribed iPhone / Google / Outlook calendars pick up task changes.
on:
  schedule:
    # Daily at 03:07 UTC (6:07 AM Riyadh); use Run workflow for an immediate refresh
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    env:
      # Firebase web config is public (it ships in the site bundle).
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'emfti-aa11a' }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyANAgXZ1e9o77jCJyfTuQdK04pGIqCSf30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build calendar.ics
        run: node src/scripts/build-ics.mjs site/calendar.ics

      - name: Publish if changed
        working-directory: site
        run: |
          # DTSTAMP changes on every edit, so a plain diff is enough
          if git diff --quiet -- calendar.ics && git ls-files --error-unmatch calendar.ics >/dev/null 2>&1; then
            echo "Calendar unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "Update calendar feed"
          git push
